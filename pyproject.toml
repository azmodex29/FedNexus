[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fednexus"
version = "0.1.0"
description = "FedNexus: a CPU-only distributed federated learning framework for MNIST"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.43.0,<1.44.0",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "streamlit==1.67.0",
    "altair>=5,<7",
    "pandas==3.1.1",
    "numpy==2.4.6",
    "websockets>=16.1.1,<17",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "fednexus-project-contributors"
fab-format-version = 1
flwr-version-target = "1.43.0"

[tool.flwr.app.components]
serverapp = "pytorchexample.server_app:app"
clientapp = "pytorchexample.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 5
fraction-evaluate = 1.0
local-epochs = 1
learning-rate = 0.05
batch-size = 32
save-model = true
